<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Foundry UI is a portable, framework-agnostic component and pattern library.">
  <title>Foundry UI</title>
  <script>
    try {
      if (localStorage.getItem('foundry-theme') === 'dark') document.documentElement.classList.add('fd-theme-dark');
      const savedAccent = JSON.parse(localStorage.getItem('foundry-accent') || 'null');
      if (savedAccent?.value && savedAccent?.tokens) {
        Object.entries(savedAccent.tokens).forEach(([property, value]) => document.documentElement.style.setProperty(property, value));
        document.documentElement.dataset.customAccent = savedAccent.value;
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="src/foundry.css?v=0.23.5">
  <link rel="stylesheet" href="docs.css?v=0.23.5">
</head>
<body>
  <a class="fd-skip-link" href="#main">Skip to main content</a>
  <header class="docs-header">
    <a class="docs-brand" href="#/" aria-label="Foundry UI home">
      <span class="docs-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" focusable="false">
          <path class="docs-logo__frame" d="M5 9.5 10.5 4h11L27 9.5v13L21.5 28h-11L5 22.5Z"/>
          <path class="docs-logo__letter" d="M10 9h11v4h-6.5v3H20v4h-5.5v6H10Z"/>
          <path class="docs-logo__spark" d="m24.5 3 .9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z"/>
        </svg>
      </span>
      <span><b>FOUNDRY UI</b><small>INTERFACE LIBRARY</small></span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="#/foundations">Foundation</a>
      <a class="active" href="#/components">Components</a>
      <a href="#/patterns">Patterns</a>
      <a href="#/about">About</a>
    </nav>
    <div class="docs-header__actions">
      <button class="fd-icon-button theme-toggle" type="button" aria-label="Use dark colour scheme"><svg class="fd-icon"><use href="#moon"></use></svg></button>
      <button class="fd-icon-button nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><svg class="fd-icon"><use href="#menu"></use></svg></button>
    </div>
  </header>
  <aside class="docs-sidebar" aria-label="Component navigation">
    <label class="docs-search"><svg class="fd-icon"><use href="#search"></use></svg><input id="component-search" type="search" placeholder="Search components" autocomplete="off"><kbd>/</kbd></label>

    <div class="docs-sidebar-footer"><span class="fd-badge fd-badge--success">v0.23.5</span><a href="README.md">Documentation</a></div>

  <main id="main" tabindex="-1"></main>
  <div class="copy-toast" role="status" aria-live="polite"><svg class="fd-icon"><use href="#check"></use></svg><span>Code copied</span></div>

</body>
</html>
