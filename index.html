<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A portable component library extracted from the public Raiffeisen Bank Hungary website.">
  <title>Raiffeisen HU Design System</title>
  <link rel="stylesheet" href="src/raif.css">
  <link rel="stylesheet" href="docs.css">
</head>
<body>
  <a class="rb-skip-link" href="#main">Skip to main content</a>
  <header class="docs-header">
    <a class="docs-brand" href="#/" aria-label="Raiffeisen HU Design System home">
      <span class="docs-logo" aria-hidden="true">╳</span>
      <span><b>RAIFFEISEN HU</b><small>DESIGN SYSTEM</small></span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="#/foundations">Foundations</a>
      <a class="active" href="#/components">Components</a>
      <a href="#/patterns">Patterns</a>
      <a href="#/about">About</a>
    </nav>
    <button class="rb-button rb-button--tertiary docs-search-trigger" type="button" aria-label="Focus component search"><svg class="rb-icon"><use href="src/icons.svg#search"></use></svg><span>Search</span></button>
    <button class="rb-icon-button theme-toggle" type="button" aria-label="Switch colour scheme"><svg class="rb-icon"><use href="src/icons.svg#moon"></use></svg></button>
    <button class="rb-icon-button nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><svg class="rb-icon"><use href="src/icons.svg#menu"></use></svg></button>
  </header>
  <aside class="docs-sidebar" aria-label="Component navigation">
    <label class="docs-search"><svg class="rb-icon"><use href="src/icons.svg#search"></use></svg><input id="component-search" type="search" placeholder="Search components" autocomplete="off"><kbd>/</kbd></label>
    <nav id="component-nav"></nav>
    <div class="docs-sidebar-footer"><span class="rb-badge rb-badge--success">v0.1.0</span><a href="README.md">Documentation</a></div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <div class="copy-toast" role="status" aria-live="polite"><svg class="rb-icon"><use href="src/icons.svg#check"></use></svg><span>Code copied</span></div>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
